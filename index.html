<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Sudoku solver and generator, exact cover with dancing links">
	<meta name="theme-color" content="#fdfdfc">
	<title>Sudoku</title>

	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="Sudoku">

	<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
	<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

	<link rel="stylesheet" href="style.css?v=12c8799">
	<script src="bundle.js?v=12c8799" defer></script>
</head>
<body>
	<main>
		<h1>Sudoku</h1>
		<p id="status" class="status" role="status">Enter digits, then solve.</p>
		<div id="board" class="board"></div>
		<div class="controls">
			<button type="button" id="generate" aria-label="New puzzle" title="New puzzle">
				<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
					<rect x="4" y="4" width="16" height="16" rx="3"/>
					<circle class="solid" cx="8.8" cy="8.8" r="1.7"/>
					<circle class="solid" cx="12" cy="12" r="1.7"/>
					<circle class="solid" cx="15.2" cy="15.2" r="1.7"/>
				</svg>
			</button>
			<button type="button" id="check" aria-label="Check the entry" title="Check the entry">
				<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
					<circle cx="10.25" cy="10.25" r="6.75"/>
					<path d="M15.1 15.1 21 21"/>
				</svg>
			</button>
			<button type="button" id="solve" aria-label="Solve the puzzle" title="Solve the puzzle">
				<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
					<path d="M3.5 20.5 13.5 10.5"/>
					<path class="solid" d="M17.5 2.5 18.9 6.1 22.5 7.5 18.9 8.9 17.5 12.5 16.1 8.9 12.5 7.5 16.1 6.1Z"/>
				</svg>
			</button>
			<button type="button" id="clear" aria-label="Clear the board" title="Clear the board">
				<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
					<path d="M4.5 6.75H19.5"/>
					<path d="M9.75 6.75V4.5H14.25V6.75"/>
					<path d="M6.75 6.75 7.75 20.25H16.25L17.25 6.75"/>
				</svg>
			</button>
			<button type="button" id="photo" aria-label="Read a puzzle from a photo" title="Read a puzzle from a photo">
				<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
					<path d="M2.75 7.75H6.75L8.25 5.25H15.75L17.25 7.75H21.25V19.25H2.75Z"/>
					<circle cx="12" cy="13.5" r="3.6"/>
				</svg>
			</button>
		</div>
		<footer>
			<p>Everything runs in your browser. No photo or puzzle is uploaded.</p>
			<p>Build <span id="build">12c8799</span></p>
		</footer>
	</main>
</body>
</html>
