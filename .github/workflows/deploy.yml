name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          # esbuild, lightningcss and wasm-pack, in the versions package-lock.json names.
          npm ci

      - name: Build
        run: ./build.sh dist "$(git rev-parse --short HEAD)"

      - name: Push to dist branch
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          SHA=$(git rev-parse --short HEAD)
          git checkout --orphan dist-new
          git rm -rf . --cached -q
          # The files of dist/ become the root of the branch.
          git --work-tree=dist add --all
          git commit -m "dist: build from $SHA"
          git push origin HEAD:dist --force

      - name: Trigger webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          TIMESTAMP=$(date +%s)
          ID=$(uuidgen | tr '[:upper:]' '[:lower:]')
          PAYLOAD="{\"id\":\"$ID\",\"param\":\"sudoku-solver\",\"unix_seconds\":$TIMESTAMP}"
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')
          curl -sf -X POST https://webhook.erdferkel.eu/ \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -d "$PAYLOAD"
